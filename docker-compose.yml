services:
  phantom:
    build: .
    init: true
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:${PHANTOM_PORT:-5100}:5100"
      # Optional noVNC profile below remains loopback-only.
      - "127.0.0.1:${PHANTOM_NOVNC_PORT:-6080}:6080"
    environment:
      PHANTOM_DATA_DIR: /data
      PHANTOM_BIND: 0.0.0.0
      PHANTOM_PORT: 5100
      PHANTOM_NOVNC: "${PHANTOM_NOVNC:-0}"
      PHANTOM_NOVNC_LISTEN: 0.0.0.0:6080
      PHANTOM_VNC_PASSWORD_FILE: /run/secrets/vnc_password
    volumes:
      - phantom-data:/data
      - phantom-artifacts:/data/artifacts
      - ${PHANTOM_VNC_PASSWORD_FILE:-/dev/null}:/run/secrets/vnc_password:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  phantom-data:
  phantom-artifacts:
