[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-browser"
version = "0.1.0"
description = "Self-hosted antidetect browser profile manager — Camoufox + BrowserForge persistent fingerprints"
requires-python = ">=3.10"
dependencies = [
  "camoufox[geoip]>=0.5.4",
  "browserforge>=1.2.4",
  "playwright>=1.60",
  "platformdirs>=3",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phantom = ["schema.sql", "migrations/*.sql"]
